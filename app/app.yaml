command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]

env:
  # Recursos configurados na criação do App (Compute → Apps → seu app → Edit → App resources)
  - name: LLM_MODEL_SERVICE
    valueFrom: model              # recurso "Unity Gateway model service" (EXECUTE) -> nome catalogo.schema.servico
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: experiment         # recurso "MLflow experiment" com permissão "Can edit"
  - name: MLFLOW_TRACKING_URI
    value: databricks
